name: Publish Skills
on:
  workflow_dispatch:
    inputs:
      backend:
        description: 'github = GitHub Release; r2 = verified R2 upload + channel switch + GitHub Release'
        type: choice
        options: [github, r2]
        default: github
        required: true
permissions:
  contents: write
concurrency:
  group: fish-skills-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Validate and package committed content
        env:
          PYTHONPATH: src
        run: python -m fish_skills.cli build
      - name: Publish immutable package
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          PUBLISH_BACKEND: ${{ inputs.backend }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          FISH_SKILLS_PREFIX: ${{ vars.FISH_SKILLS_PREFIX || 'fish-skills' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/release.py
      - name: Save publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-evidence
          path: dist/
          if-no-files-found: ignore
          retention-days: 30
