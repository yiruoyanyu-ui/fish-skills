name: Switch R2 channel
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'An existing verified release version, e.g. 0.1.0-preview.2'
        type: string
        required: true
      channel:
        description: 'Must match the target bundle channel'
        type: choice
        options: [preview, stable]
        default: preview
permissions:
  contents: read
concurrency:
  group: fish-skills-publication
  cancel-in-progress: false
jobs:
  switch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - name: Verify complete existing version, then switch pointer
        env:
          PYTHONPATH: src
          FISH_SKILLS_BACKEND: r2
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          FISH_SKILLS_PREFIX: ${{ vars.FISH_SKILLS_PREFIX || 'fish-skills' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m fish_skills.cli promote "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL"
